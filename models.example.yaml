# Copy to models.yaml and keep the models you want to benchmark.
# The key is the model's id in results/ and reports. API keys come from environment variables.
models:
  # --- Anthropic (ANTHROPIC_API_KEY) ---
  opus-5.5:
    name: Claude Opus 5.5
    provider: anthropic
    model: claude-opus-5-5
    effort: high          # low | medium | high | xhigh | max (Opus 5.5 defaults to medium)
  sonnet-5.5:
    name: Claude Sonnet 5.5
    provider: anthropic
    model: claude-sonnet-5-5
    effort: high
  haiku-5.5:
    name: Claude Haiku 5.5
    provider: anthropic
    model: claude-haiku-5-5

  # --- Any OpenAI-compatible Chat Completions endpoint ---
  # gpt:
  #   name: GPT (OpenAI)
