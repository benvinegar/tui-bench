id: text-editor
title: Text editor
summary: A Notepad-style editor with a menu bar, line numbers, mouse cursor placement, selection, clipboard, find, wheel scrolling and an unsaved-changes dialog.
size: { cols: 100, rows: 30 }
tags: [editor, mouse, menu, selection, dialog, desktop]
prompt: |
  Build a desktop-style text editor (think Notepad, gedit or micro) that opens `data/notes.md`.

  ## Layout (partly fixed, so scripted mouse input lands on known targets)
  - **Row 0: menu bar** with the menus `File`, `Edit`, `View` and `Help`, in that order. The word `File` must occupy
    columns 1–4. Clicking a menu title (or pressing `F10` to open `File`, then `←`/`→`) opens its drop-down. Menus:
    File: New, Save (`ctrl+s`), Quit (`ctrl+q`); Edit: Undo, Cut, Copy, Paste, Select all, Find…; View: Line numbers,
    Syntax highlighting; Help: Keyboard shortcuts. Each item shows its shortcut. In an open menu `↑`/`↓` move,
    `enter` runs the item, `esc` or a click elsewhere closes it.
  - **Rows 1 to height−2: the text area.** Line 1 of the file is on screen row 1 when scrolled to the top. A
    line-number gutter takes exactly columns 0–4 (numbers right-aligned in 4 columns, then one separator column),
    so text column 1 of a line is screen column 5.
  - **Last row: status bar** with the file name, a modified marker when there are unsaved changes, the cursor
    position as `Ln <line>, Col <column>` (both 1-based), and the language (`Markdown`).

  The app must enable mouse reporting.

  ## Editing
  - The cursor starts at line 1, column 1, and is shown as a terminal cursor or a highlighted cell.
  - Arrow keys, `home`/`end`, `pageup`/`pagedown`, and `ctrl+home`/`ctrl+end` (start/end of the file) move the
    cursor. Typing inserts at the cursor, `enter` splits the line, `backspace`/`delete` remove characters.
  - Clicking in the text area moves the cursor to the clicked position (or the end of the line if the click is
    past it). The mouse wheel scrolls the view by 3 lines per step without moving the cursor.
  - `shift` with movement keys extends a selection, shown highlighted. `ctrl+a` selects everything. `ctrl+c`,
    `ctrl+x` and `ctrl+v` copy, cut and paste (an internal clipboard is fine). Typing or pasting replaces the selection.
  - `ctrl+z` undoes the last edit.
  - `ctrl+f` opens a find bar (a one-line input). `enter` selects the next match after the cursor (wrapping around)
    and scrolls it into view; the bar shows the match number and count (e.g. `2 of 5`). `esc` closes it.
  - Syntax highlighting for Markdown (headings, emphasis, inline code, code blocks, list markers, links) is expected.
  - Long lines are not wrapped; the view scrolls horizontally to keep the cursor visible.

  ## Saving and quitting
  - `ctrl+s` writes the file back and clears the modified marker.
  - `ctrl+q` quits. If there are unsaved changes, it first shows a centered modal dialog
    ("Save changes to notes.md?") with three buttons, Save, Don't Save and Cancel; keys `s`, `n` and `esc` choose
    them, and they can be clicked.

  The layout must adapt to the terminal size and redraw correctly when the terminal is resized.
scenario:
  - snapshot: initial
    note: notes.md is open at the top with line numbers, Markdown highlighting, and Ln 1, Col 1.
    expect:
      - { at: { x: 5, y: 3 }, text: "Our launch is on Friday.", label: "line 3 starts at screen column 5" }
      - { inOrder: [File, Edit, View, Help], in: { rows: [0, 0] } }
      - { at: { x: 1, y: 0 }, text: File }
      - { contains: "Ln 1, Col 1", in: { rows: [-1, -1] } }
  - click: { x: 9, y: 3 }
  - type: "big "
  - snapshot: click-and-type
    note: Line 3 now reads "Our big launch is on Friday."; the status bar shows modified and Ln 3, Col 9.
    expect:
      - { at: { x: 5, y: 3 }, text: "Our big launch is on Friday." }
      - { contains: "Ln 3, Col 9", in: { rows: [-1, -1] } }
  - press: home shift+down shift+down
  - snapshot: selection
    note: Lines 3 and 4 are highlighted as a selection.
  - press: ctrl+x ctrl+end ctrl+v
  - snapshot: cut-paste
    note: The two lines were cut from the top and pasted at the end of the file; the view shows the end.
    expect:
      - { inOrder: ["Keep it under 90 seconds", "Our big launch is on Friday.", "Everything below needs an owner"], label: "the two lines were pasted at the end" }
  - press: ctrl+home ctrl+f
  - type: TODO
  - press: enter enter
  - snapshot: find
    note: The find bar shows "TODO" with "2 of 4", and the second TODO (the onboarding emails line) is selected.
    expect:
      - { contains: "2 of 4" }
  - press: esc
  - scroll: { x: 40, y: 15, direction: down, amount: 5 }
  - snapshot: wheel-scroll
    note: The view scrolled down 15 lines (the first visible line number is 16) while the cursor stayed put.
    expect:
      - { at: { x: 2, y: 1 }, text: "16", label: "first visible line is 16" }
  - click: { x: 2, y: 0 }
  - snapshot: file-menu
    note: The File menu is open below its title, listing New, Save, Quit with shortcuts.
    expect:
      - { inOrder: [New, Save, Quit], label: "File menu items" }
  - press: esc
  - resize: { cols: 80, rows: 24 }
  - snapshot: resized
    note: At 80x24 the menu bar, gutter and status bar still fit.
    expect:
      - { contains: "Ln ", in: { rows: [-1, -1] } }
  - press: ctrl+q
  - snapshot: unsaved-dialog
    note: A modal asks whether to save changes to notes.md, with Save / Don't Save / Cancel buttons.
    expect:
      - { contains: notes.md }
      - { matches: "Don.t Save" }
      - { contains: Cancel }
  - press: n
  - expectExit: 3000
